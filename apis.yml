aid: chapter
name: Chapter
description: 'Chapter is a technology-driven Medicare advisory service (parent company Memoir, Inc.;
  insurance services via Chapter Advisory, LLC) that helps older Americans navigate retirement healthcare.
  Licensed advisors and self-service tools compare and enroll consumers across all major Medicare carriers
  nationwide, representing 50 organizations offering more than 15,000 products, and serving 500,000+
  enrollees with a 4.9/5 rating across 6,700+ reviews. Chapter is HIPAA compliant, BBB accredited, and
  also ships a consumer OTC benefits app. Founded 2020 in New York City; backed by Addition. This is a
  consumer healthtech company with no public developer/API surface at the time of enrichment.'
